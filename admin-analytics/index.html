<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuguTsucool｜運営分析</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/styles.css">
<style>
:root{--a:#087f6f;--ink:#0b1f3a;--muted:#65758b;--line:#dce4ee;--bg:#f5f8fc;--card:#fff;--good:#168b61;--warn:#d97706}
body{background:var(--bg);color:var(--ink)}.admin-wrap{max-width:1180px;margin:auto;padding:34px 24px 80px}.admin-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--a)}.admin-top h1{font-size:27px;margin:5px 0 6px}.admin-top p{margin:0;color:var(--muted)}.public-link{font-weight:700;color:var(--a);text-decoration:none}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 36px rgba(23,43,77,.06)}.auth{display:grid;grid-template-columns:1fr 240px 160px 110px;gap:10px;align-items:end}.field2 label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field2 input,.field2 select{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:10px;padding:12px;background:white}.btn2{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--a);color:#fff}.btn2.secondary{background:#eef4f7;color:#284056}.auth-note{font-size:12px;color:var(--muted);margin-top:8px}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0;gap:12px;flex-wrap:wrap}.filters{display:flex;gap:8px;align-items:center}.filters button{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 12px;cursor:pointer}.filters button.active{background:var(--ink);color:white}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{font-size:28px;display:block;margin-top:7px}.kpi small{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.panel h2{font-size:17px;margin:0 0 14px}.chart{height:250px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{stroke:#dce4ee;stroke-width:1}.line{fill:none;stroke:#087f6f;stroke-width:3}.area{fill:rgba(8,127,111,.08)}.dot{fill:#087f6f}.chart-label{font-size:10px;fill:#7b8797}.funnel{display:grid;gap:10px}.funnel-row{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center}.bar{height:13px;background:#e8eef5;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:#087f6f;border-radius:99px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e7edf4;padding:10px 8px;white-space:nowrap}th{color:var(--muted);font-size:11px;text-transform:uppercase}.rank{font-weight:800}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#eef8f5;color:#087f6f;font-size:11px}.empty{color:var(--muted);padding:30px;text-align:center}.status{font-size:12px;color:var(--muted)}.source-list{display:grid;gap:10px}.source-row{display:grid;grid-template-columns:130px 1fr 60px;gap:10px;align-items:center;font-size:13px}.mini-bar{background:#e8eef5;border-radius:99px;height:9px;overflow:hidden}.mini-bar i{display:block;height:100%;background:#4f77a7}.event{display:grid;grid-template-columns:130px 120px 1fr 90px;gap:10px;padding:9px 0;border-bottom:1px solid #edf1f5;font-size:12px}.event .muted{color:var(--muted)}
@media(max-width:900px){.auth{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.event{grid-template-columns:1fr 1fr}.event div:nth-child(3){grid-column:1/-1}}
@media(max-width:560px){.admin-wrap{padding:20px 12px 60px}.admin-top{display:block}.public-link{display:inline-block;margin-top:10px}.auth{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:23px}.funnel-row{grid-template-columns:95px 1fr 54px}}
</style>
</head>
<body>
<main class="admin-wrap">
  <div class="admin-top"><div><div class="eyebrow">PRIVATE DASHBOARD</div><h1>SuguTsucool｜運営分析</h1><p>流入 → 回遊 → ツール実行 → 完了まで、サイト内行動を確認します。</p></div><a class="public-link" href="/" target="_blank">公開サイトを見る ↗</a></div>
  <section class="panel" id="authPanel"><h2>管理者認証</h2><div class="auth">
    <div class="field2"><label>分析API URL</label><input id="apiUrl" value="https://sugutsucool-analytics.super-canon-boy.workers.dev"></div>
    <div class="field2"><label>ADMIN_TOKEN</label><input id="token" type="password" placeholder="ADMIN_TOKEN"></div>
    <button class="btn2" id="loadBtn">読み込む</button><button class="btn2 secondary" id="clearBtn">消去</button>
  </div><div class="auth-note">トークンはこのブラウザの sessionStorage だけに保存します。API URL はこの端末に保存できます。</div></section>
  <div id="dashboard" class="hidden">
    <div class="toolbar"><div class="filters"><button data-days="7">7日</button><button data-days="30" class="active">30日</button><button data-days="90">90日</button><button id="refresh">更新</button></div><label class="toggle"><input type="checkbox" id="optout"> 自分のアクセスを除外</label><div class="status" id="status">—</div></div>
    <section class="kpis">
      <div class="kpi"><span>今日のユーザー</span><b id="kUsers">0</b><small id="kUsersSub">—</small></div>
      <div class="kpi"><span>今日のページビュー</span><b id="kPv">0</b><small id="kPvSub">—</small></div>
      <div class="kpi"><span>ツール実行</span><b id="kActions">0</b><small id="kActionsSub">選択期間</small></div>
      <div class="kpi"><span>完了 / DL</span><b id="kDone">0</b><small id="kDoneSub">選択期間</small></div>
    </section>
    <div class="grid2">
      <section class="panel"><h2>アクセス推移</h2><div class="chart" id="trendChart"></div></section>
      <section class="panel"><h2>利用ファネル</h2><div class="funnel" id="funnel"></div></section>
    </div>
    <div class="grid2">
      <section class="panel"><h2>人気ツール</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>ツール</th><th>閲覧</th><th>実行</th><th>完了</th></tr></thead><tbody id="toolsBody"></tbody></table></div></section>
      <section class="panel"><h2>流入元</h2><div class="source-list" id="sources"></div></section>
    </div>
    <div class="grid3">
      <section class="panel"><h2>デバイス</h2><div class="source-list" id="devices"></div></section>
      <section class="panel"><h2>国・地域</h2><div class="source-list" id="countries"></div></section>
      <section class="panel"><h2>時間帯</h2><div class="source-list" id="hours"></div></section>
    </div>
    <div class="grid2">
      <section class="panel"><h2>よく見られているページ</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>ページ</th><th>PV</th><th>ユーザー</th></tr></thead><tbody id="pagesBody"></tbody></table></div></section>
      <section class="panel"><h2>直近イベント</h2><div id="events"></div></section>
    </div>
  </div>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s), apiInput=$('#apiUrl'), tokenInput=$('#token'), dash=$('#dashboard'), status=$('#status');
const API_KEY='sugutsucool_analytics_api', OPT='sugutsucool_analytics_optout'; let days=30;
apiInput.value=localStorage.getItem(API_KEY)||apiInput.value; tokenInput.value=sessionStorage.getItem('sugutsucool_admin_token')||''; $('#optout').checked=localStorage.getItem(OPT)==='1';
function num(n){return Number(n||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){const api=apiInput.value.trim().replace(/\/$/,''); const token=tokenInput.value.trim(); if(!api||!token){alert('分析API URLとADMIN_TOKENを入力してください');return;} localStorage.setItem(API_KEY,api); sessionStorage.setItem('sugutsucool_admin_token',token); status.textContent='読み込み中…';
try{const r=await fetch(api+'/admin/summary?days='+days,{headers:{authorization:'Bearer '+token}}); if(!r.ok)throw new Error('HTTP '+r.status); const d=await r.json(); dash.classList.remove('hidden'); render(d); status.textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}catch(e){dash.classList.add('hidden'); status.textContent=''; alert('読み込めませんでした。API URL・ADMIN_TOKEN・Worker設定を確認してください。\n'+e.message)}}
function render(d){$('#kUsers').textContent=num(d.today.users);$('#kPv').textContent=num(d.today.pageviews);$('#kActions').textContent=num(d.period.tool_actions);$('#kDone').textContent=num(d.period.completions);$('#kUsersSub').textContent='今日';$('#kPvSub').textContent='今日'; renderTrend(d.daily||[]);renderFunnel(d.funnel||{});renderTools(d.top_tools||[]);renderSources('#sources',d.sources||[],'source');renderSources('#devices',d.devices||[],'device');renderSources('#countries',d.countries||[],'country');renderSources('#hours',d.hours||[],'hour');renderPages(d.top_pages||[]);renderEvents(d.latest||[])}
function renderTrend(rows){const el=$('#trendChart');if(!rows.length){el.innerHTML='<div class="empty">まだデータがありません</div>';return;}const W=700,H=230,p=28,max=Math.max(1,...rows.map(x=>+x.pageviews));let pts=[];rows.forEach((r,i)=>{const x=p+(W-2*p)*(i/Math.max(1,rows.length-1)),y=H-p-(H-2*p)*(+r.pageviews/max);pts.push([x,y])});const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');const area='M '+pts[0][0]+' '+(H-p)+' '+pts.map(q=>'L '+q[0]+' '+q[1]).join(' ')+' L '+pts[pts.length-1][0]+' '+(H-p)+' Z';const labels=rows.filter((_,i)=>i===0||i===rows.length-1||i===Math.floor(rows.length/2)).map((r)=>{const i=rows.indexOf(r),x=p+(W-2*p)*(i/Math.max(1,rows.length-1));return `<text x="${x}" y="${H-4}" text-anchor="middle" class="chart-label">${esc(r.day.slice(5))}</text>`}).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" class="axis"/><path d="${area}" class="area"/><path d="${line}" class="line" vector-effect="non-scaling-stroke"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" class="dot"/>`).join('')}${labels}</svg>`}
function renderFunnel(f){const arr=[['ページ閲覧',f.pageviews],['ツール表示',f.tool_opens],['ツール実行',f.tool_actions],['完了 / DL',f.completions]],max=Math.max(1,...arr.map(x=>+x[1]||0));$('#funnel').innerHTML=arr.map(([k,v])=>`<div class="funnel-row"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.max(2,(+v||0)/max*100)}%"></i></div><b>${num(v)}</b></div>`).join('')}
function renderTools(rows){$('#toolsBody').innerHTML=rows.length?rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(r.tool||r.path)}</td><td>${num(r.views)}</td><td>${num(r.actions)}</td><td>${num(r.completions)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">まだデータがありません</td></tr>'}
function renderSources(sel,rows,key){const el=$(sel),max=Math.max(1,...rows.map(r=>+r.count||0));el.innerHTML=rows.length?rows.slice(0,10).map(r=>`<div class="source-row"><span>${esc(r[key]||'不明')}</span><div class="mini-bar"><i style="width:${(+r.count||0)/max*100}%"></i></div><b>${num(r.count)}</b></div>`).join(''):'<div class="empty">まだデータがありません</div>'}
function renderPages(rows){$('#pagesBody').innerHTML=rows.length?rows.map((r,i)=>`<tr><td class="rank">${i+1}</td><td title="${esc(r.path)}">${esc(r.path)}</td><td>${num(r.pageviews)}</td><td>${num(r.users)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">まだデータがありません</td></tr>'}
function renderEvents(rows){$('#events').innerHTML=rows.length?rows.slice(0,20).map(r=>`<div class="event"><div class="muted">${esc((r.ts||'').replace('T',' ').slice(5,16))}</div><div><span class="pill">${esc(r.event_type)}</span></div><div>${esc(r.tool||r.path||'')}</div><div class="muted">${esc(r.device||'')}</div></div>`).join(''):'<div class="empty">まだデータがありません</div>'}
$('#loadBtn').onclick=load;$('#clearBtn').onclick=()=>{sessionStorage.removeItem('sugutsucool_admin_token');tokenInput.value='';dash.classList.add('hidden')};$('#refresh').onclick=load;document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-days]').forEach(x=>x.classList.remove('active'));b.classList.add('active');days=+b.dataset.days;load()});$('#optout').onchange=e=>{if(e.target.checked)localStorage.setItem(OPT,'1');else localStorage.removeItem(OPT)};if(tokenInput.value)load();
})();
</script>
</body></html>

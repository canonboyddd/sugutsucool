name: Deploy SuguTsucool to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='functions' \
            --exclude='scripts' \
            --exclude='qa-results' \
            ./ dist/

      - name: Generate 100 additional tool pages (150 total)
        shell: bash
        run: node scripts/generate-plus-tools.mjs

      - name: Prioritize 30 high-intent SEO tools
        shell: bash
        run: node scripts/apply-priority-seo.mjs

      - name: Add long-tail search intent SEO
        shell: bash
        run: node scripts/apply-longtail-seo.mjs

      - name: Add FAQ comparison and examples to priority tools
        shell: bash
        run: node scripts/apply-seo-depth.mjs

      - name: Generate 30 dedicated SEO guide pages
        shell: bash
        run: node scripts/generate-seo-guides.mjs

      - name: Verify deep SEO and guide build
        shell: bash
        run: |
          set -euo pipefail
          roots='dist/image dist/pdf dist/text dist/web dist/calculator dist/developer'
          test "$(grep -Rsl 'data-priority-seo="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-longtail-seo="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-seo-depth="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-seo-guide-link="1"' $roots | wc -l)" -eq 30
          test -f dist/guides/index.html
          test "$(find dist/guides -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 30
          grep -q 'id="priorityTools"' dist/index.html
          grep -q 'id="guideFeature"' dist/index.html
          grep -q '150種類' dist/index.html
          grep -q '公開中 150ツール' dist/index.html
          grep -q '画像圧縮 オンライン' dist/image/compress/index.html
          grep -q 'PDF 結合 オンライン' dist/pdf/merge/index.html
          grep -q '文字数 カウント 空白除く' dist/text/character-count/index.html
          grep -q 'QRコード PNG ダウンロード' dist/web/qr-code/index.html
          grep -q 'JSON formatter 無料' dist/developer/json-formatter/index.html
          grep -q '検索意図を詳しく解説' dist/image/compress/index.html
          grep -q '似たツールとの違い' dist/pdf/merge/index.html
          grep -q '具体的な利用例' dist/calculator/work-hours/index.html
          grep -q '使う前に確認したいこと' dist/developer/json-formatter/index.html
          grep -q '画像圧縮の使い方ガイド' dist/guides/image-compress/index.html
          grep -q 'PDF結合の使い方ガイド' dist/guides/pdf-merge/index.html
          grep -q 'JSON整形・検証の使い方ガイド' dist/guides/developer-json-formatter/index.html
          grep -q 'https://sugutsucool.pages.dev/guides/' dist/sitemap.xml
          echo 'SEO verification passed: 30 deep tool pages + 30 dedicated guide pages + guide index + backlinks + sitemap'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sugutsucool --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

name: Deploy SuguTsucool to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate critical JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/analytics-track.js
          node --check assets/affiliate-tools.js
          node --check assets/tool-pro.js
          node --check functions/api/rakuten.js
          node --check scripts/generate-seo-guides-plus.mjs
          node --check scripts/generate-question-guides.mjs
          node --check scripts/verify-indexability.mjs
          node --check scripts/submit-indexnow.mjs

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='functions' \
            --exclude='scripts' \
            --exclude='qa-results' \
            --exclude='dist' \
            ./ dist/

      - name: Generate 100 additional tool pages (150 total)
        run: node scripts/generate-plus-tools.mjs

      - name: Prioritize 30 high-intent SEO tools
        run: node scripts/apply-priority-seo.mjs

      - name: Add long-tail search intent SEO
        run: node scripts/apply-longtail-seo.mjs

      - name: Add FAQ comparison and examples to priority tools
        run: node scripts/apply-seo-depth.mjs

      - name: Generate 30 dedicated SEO guide pages
        run: node scripts/generate-seo-guides.mjs

      - name: Expand guide library to 60 pages
        run: node scripts/generate-seo-guides-plus.mjs

      - name: Expand guide library to 100 question-focused pages
        run: node scripts/generate-question-guides.mjs

      - name: Verify deep SEO and guide build
        shell: bash
        run: |
          set -euo pipefail
          roots='dist/image dist/pdf dist/text dist/web dist/calculator dist/developer'
          test "$(grep -Rsl 'data-priority-seo="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-longtail-seo="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-seo-depth="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-seo-guide-link="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-seo-guide-extra-link="1"' $roots | wc -l)" -eq 30
          test "$(grep -Rsl 'data-question-guide-links="1"' $roots | wc -l)" -eq 20
          test -f dist/guides/index.html
          test "$(find dist/guides -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 100
          grep -q '100 GUIDE PAGES' dist/guides/index.html
          grep -q 'id="priorityTools"' dist/index.html
          grep -q 'id="guideFeature"' dist/index.html
          grep -q '150種類' dist/index.html
          grep -q '公開中 150ツール' dist/index.html
          grep -q '画像圧縮 オンライン' dist/image/compress/index.html
          grep -q 'PDF 結合 オンライン' dist/pdf/merge/index.html
          grep -q '文字数 カウント 空白除く' dist/text/character-count/index.html
          grep -q 'QRコード PNG ダウンロード' dist/web/qr-code/index.html
          grep -q 'JSON formatter 無料' dist/developer/json-formatter/index.html
          grep -q '画像圧縮の使い方ガイド' dist/guides/image-compress/index.html
          grep -q '画像圧縮の選び方・失敗対策' dist/guides/image-compress-tips/index.html
          grep -q 'PDF結合の選び方・失敗対策' dist/guides/pdf-merge-tips/index.html
          grep -q '画像を1MB以下にする方法' dist/guides/image-under-1mb/index.html
          grep -q 'PDFを1つにまとめる方法' dist/guides/merge-pdf-into-one/index.html
          grep -q '勤務時間から休憩時間を引く方法' dist/guides/work-hours-minus-break/index.html
          grep -q 'JSONエラーを見つけて整形する方法' dist/guides/find-json-error/index.html
          grep -q '/assets/guides.css' dist/guides/image-compress/index.html
          test -f dist/0dadd301dab16f2cf1e3293f3f30a161.txt
          grep -qx '0dadd301dab16f2cf1e3293f3f30a161' dist/0dadd301dab16f2cf1e3293f3f30a161.txt
          echo 'Deep SEO verification passed: 30 priority tools + 100 dedicated guides'

      - name: Verify crawlability, canonicals and sitemap
        run: node scripts/verify-indexability.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sugutsucool --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify IndexNow of sitemap URLs
        continue-on-error: true
        env:
          INDEXNOW_BASE_URL: https://sugutsucool.pages.dev
          INDEXNOW_KEY: 0dadd301dab16f2cf1e3293f3f30a161
        run: node scripts/submit-indexnow.mjs

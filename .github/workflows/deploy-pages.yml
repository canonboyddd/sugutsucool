name: Deploy SuguTsucool to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='functions' \
            --exclude='scripts' \
            --exclude='qa-results' \
            ./ dist/

      - name: Generate 100 additional tool pages (150 total)
        shell: bash
        run: node scripts/generate-plus-tools.mjs

      - name: Prioritize 30 high-intent SEO tools
        shell: bash
        run: node scripts/apply-priority-seo.mjs

      - name: Verify priority SEO build
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Rsl 'data-priority-seo="1"' dist/image dist/pdf dist/text dist/web dist/calculator dist/developer | wc -l)" -eq 30
          grep -q 'id="priorityTools"' dist/index.html
          grep -q '150種類' dist/index.html
          grep -q '公開中 150ツール' dist/index.html
          echo 'Priority SEO verification passed: 30 pages + homepage'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sugutsucool --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

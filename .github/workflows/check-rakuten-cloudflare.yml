name: Check Rakuten Cloudflare Secrets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-rakuten-cloudflare.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Rakuten secret names and types across Cloudflare Pages
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          projects_json="$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "$api")"
          echo "$projects_json" | jq -e '.success == true' >/dev/null

          echo "=== Cloudflare Pages / Rakuten secret check ==="
          mapfile -t projects < <(echo "$projects_json" | jq -r '.result[].name' | sort)
          required=(RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFFILIATE_ID)
          overall=0

          for project in "${projects[@]}"; do
            detail="$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "$api/$project")"
            echo "$detail" | jq -e '.success == true' >/dev/null
            project_ok=1

            for key in "${required[@]}"; do
              present="$(echo "$detail" | jq -r --arg key "$key" 'if (.result.deployment_configs.production.env_vars // {}) | has($key) then "yes" else "no" end')"
              if [ "$present" != "yes" ]; then
                echo "MISS $project : $key not configured"
                project_ok=0
                overall=1
                continue
              fi

              type="$(echo "$detail" | jq -r --arg key "$key" '.result.deployment_configs.production.env_vars[$key].type // "unknown"')"
              case "$type" in
                secret_text|secret)
                  echo "OK   $project : $key ($type)"
                  ;;
                *)
                  echo "WARN $project : $key exists but type=$type"
                  project_ok=0
                  overall=1
                  ;;
              esac
            done

            if [ "$project_ok" -eq 1 ]; then
              echo "PASS $project : all 3 Rakuten values are configured as secrets"
            fi
          done

          echo "=== End check ==="
          exit "$overall"

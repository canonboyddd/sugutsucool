name: Check SuguTsucool Rakuten Cloudflare Secrets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/check-rakuten-cloudflare.yml'
      - 'functions/api/rakuten.js'
      - 'assets/affiliate-tools.js'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check SuguTsucool Rakuten secret names and types
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          project='sugutsucool'
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${project}"
          detail="$(curl -fsS -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" "$api")"
          echo "$detail" | jq -e '.success == true' >/dev/null

          echo "=== SuguTsucool / Rakuten secret check ==="
          required=(RAKUTEN_APP_ID RAKUTEN_ACCESS_KEY RAKUTEN_AFFILIATE_ID)
          overall=0

          for key in "${required[@]}"; do
            present="$(echo "$detail" | jq -r --arg key "$key" 'if (.result.deployment_configs.production.env_vars // {}) | has($key) then "yes" else "no" end')"
            if [ "$present" != "yes" ]; then
              echo "MISS $project : $key not configured"
              overall=1
              continue
            fi

            type="$(echo "$detail" | jq -r --arg key "$key" '.result.deployment_configs.production.env_vars[$key].type // "unknown"')"
            case "$type" in
              secret_text|secret)
                echo "OK   $project : $key ($type)"
                ;;
              *)
                echo "WARN $project : $key exists but type=$type"
                overall=1
                ;;
            esac
          done

          if [ "$overall" -eq 0 ]; then
            echo "PASS $project : all 3 Rakuten values are configured as production secrets"
          fi
          echo "=== End check ==="
          exit "$overall"

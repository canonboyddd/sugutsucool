name: Live QA - all 150 SuguTsucool tools + 100 guides

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy SuguTsucool to Cloudflare Pages
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: '17 18 * * *'

concurrency:
  group: sugutsucool-live-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm init -y
          npm install --no-save playwright pdf-lib pngjs
          npx playwright install --with-deps chromium
      - name: Run live browser QA for base 110 tools
        env:
          QA_BASE_URL: https://sugutsucool.pages.dev
        run: node scripts/qa-live.mjs
      - name: Run live browser QA for 40 expansion tools
        env:
          QA_BASE_URL: https://sugutsucool.pages.dev
        run: node scripts/qa-extra-40.mjs
      - name: Run live QA for 100 SEO guides
        env:
          QA_BASE_URL: https://sugutsucool.pages.dev
        run: node scripts/qa-guides.mjs
      - name: Run live QA for SEO admin and priority controls
        env:
          QA_BASE_URL: https://sugutsucool.pages.dev
        run: node scripts/qa-seo-admin.mjs
      - name: Upload QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-live-results-150-tools-100-guides
          path: qa-results/
          if-no-files-found: ignore

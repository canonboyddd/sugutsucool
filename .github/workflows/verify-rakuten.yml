name: Verify Rakuten affiliate API

on:
  push:
    branches: [main]
    paths:
      - 'functions/api/rakuten.js'
      - 'assets/affiliate-tools.js'
      - 'assets/analytics-track.js'
      - '.github/workflows/verify-rakuten.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Wait for production deployment
        run: sleep 60
      - name: Fetch Rakuten API response
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p qa-results
          status="$(curl --silent --show-error --retry 4 --retry-delay 5 --output qa-results/rakuten-response.json --write-out '%{http_code}' \
            'https://sugutsucool.pages.dev/api/rakuten?tool=image%2Fcompress' || true)"
          printf '%s\n' "$status" > qa-results/rakuten-status.txt
          echo "HTTP $status"
          cat qa-results/rakuten-response.json || true
      - name: Upload Rakuten diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-verification-response
          path: qa-results/
          if-no-files-found: error
      - name: Check Rakuten API response
        run: |
          set -euo pipefail
          test "$(cat qa-results/rakuten-status.txt)" = "200"
          python - <<'PY'
          import json
          d=json.load(open('qa-results/rakuten-response.json',encoding='utf-8'))
          assert d.get('ok') is True, d
          items=d.get('items') or []
          assert len(items)>=1, d
          assert all(x.get('name') and x.get('url') for x in items), items
          assert all('rakuten' in x.get('url','').lower() or 'r10.to' in x.get('url','').lower() for x in items), items
          print('Rakuten API OK:',len(items),'items')
          PY
      - name: Check affiliate client is published
        run: |
          curl --fail --silent --show-error 'https://sugutsucool.pages.dev/assets/affiliate-tools.js' | grep -q 'data-affiliate'

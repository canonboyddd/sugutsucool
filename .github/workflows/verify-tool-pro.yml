name: Verify 50 Tool Pro Upgrades

on:
  push:
    branches: [main]
    paths:
      - 'assets/tool-pro.js'
      - 'assets/pro-*.js'
      - 'assets/tool-enhance.js'
      - '.github/workflows/verify-tool-pro.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check assets/tool-pro.js
          node --check assets/pro-media.js
          node --check assets/pro-text-web.js
          node --check assets/pro-calc-dev.js
          node --check assets/tool-enhance.js
      - name: Verify all 50 physical tool pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('assets/catalog.js').read_text(encoding='utf-8')
          paths=re.findall(r'"((?:image|pdf|text|web|calculator|developer)/[^"/]+)"',s)
          # catalog entries are unique path strings; keep first occurrence
          seen=[]
          for p in paths:
              if p not in seen: seen.append(p)
          if len(seen)!=50:
              raise SystemExit(f'Expected 50 catalog tool paths, got {len(seen)}')
          missing=[]
          no_enhance=[]
          for p in seen:
              f=Path(p)/'index.html'
              if not f.exists():
                  missing.append(str(f)); continue
              txt=f.read_text(encoding='utf-8')
              if '/assets/tool-enhance.js' not in txt:
                  no_enhance.append(str(f))
          if missing or no_enhance:
              raise SystemExit(f'Missing={missing} no_enhance={no_enhance}')
          print(f'PASS: {len(seen)} tool pages found and enhanced')
          PY

name: Fix Sugu central pageview duplication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-central-pageview-duplication.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate direct-central send
        run: python -c 'from pathlib import Path; p=Path("assets/analytics-track.js"); s=p.read_text(); old="function send(eventType,extra,opts){central(eventType,extra||{});return post(payload(eventType,extra),!!(opts&&opts.beacon))}"; new="function send(eventType,extra,opts){return post(payload(eventType,extra),!!(opts&&opts.beacon))}"; assert old in s or new in s, "send function insertion point missing"; p.write_text(s.replace(old,new))'
      - name: Validate syntax
        run: node --check assets/analytics-track.js && node --check assets/site.js
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/analytics-track.js
          git commit -m 'Use one central analytics path for SuguTsucool'
          git push origin HEAD:main

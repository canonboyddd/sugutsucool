name: Sync current SuguTsucool site

on:
  push:
    paths:
      - '.github/workflows/sync-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror current Cloudflare Pages site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://sugutsucool.pages.dev'
          files=(
            sitemap.xml
            text/index.html
            text/sort-lines/index.html
            text/character-count/index.html
            text/remove-linebreaks/index.html
            text/dedupe-lines/index.html
            text/zenkaku-hankaku/index.html
            google11014fc80b2a37f0.html
            privacy/index.html
            manifest.webmanifest
            assets/pdf-merge.js
            assets/analytics-track.js
            assets/zenkaku-hankaku.js
            assets/favicon.svg
            assets/styles.css
            assets/remove-linebreaks.js
            assets/compress.js
            assets/site.js
            assets/sort-lines.js
            assets/pdf-delete.js
            assets/resize.js
            assets/pdf-reorder.js
            assets/profit-margin.js
            assets/exif-remove.js
            assets/rotate-flip.js
            assets/character-count.js
            assets/work-hours.js
            assets/url-encode.js
            assets/image-to-pdf.js
            assets/dedupe-lines.js
            assets/convert.js
            assets/discount.js
            assets/pdf-split.js
            assets/qr.js
            index.html
            terms/index.html
            calculator/index.html
            calculator/profit-margin/index.html
            calculator/discount/index.html
            calculator/work-hours/index.html
            pdf/index.html
            pdf/reorder/index.html
            pdf/delete-pages/index.html
            pdf/split/index.html
            pdf/merge/index.html
            web/url-encode/index.html
            web/index.html
            web/qr-code/index.html
            admin-analytics/index.html
            contact/index.html
            image/index.html
            image/convert/index.html
            image/resize/index.html
            image/rotate-flip/index.html
            image/compress/index.html
            image/exif-remove/index.html
            image/to-pdf/index.html
            robots.txt
            404.html
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl --retry 3 --fail --silent --show-error --location "$BASE/$f" -o "$f"
          done
          cat > _headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            X-Frame-Options: DENY

          /assets/*
            Cache-Control: public, max-age=604800
          EOF
          printf '%s\n' 'SuguTsucool v7 GitHub sync - 2026-09-25' > deployment-check.txt

      - name: Ensure v7 A8 affiliate integration
        shell: python
        run: |
          from pathlib import Path

          a8 = 'https://px.a8.net/svt/ejp?a8mat=4BCA7A+1FSR6I+50+2HFY7M'
          pixel = 'https://www18.a8.net/0.gif?a8mat=4BCA7A+1FSR6I+50+2HFY7M'

          css_path = Path('assets/styles.css')
          css = css_path.read_text(encoding='utf-8')
          if '.affiliate-section{' not in css:
              css += '''\n\n/* Affiliate recommendation */\n.affiliate-section{padding-top:8px}.affiliate-panel{display:flex;align-items:center;justify-content:space-between;gap:28px;background:linear-gradient(135deg,#ffffff,#f8fbff);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 8px 24px rgba(15,23,42,.04)}.affiliate-copy{min-width:0}.affiliate-copy h2{font-size:1.35rem;margin:8px 0 8px}.affiliate-copy p{margin:0 0 8px;color:#475569;max-width:720px}.affiliate-pr{display:inline-block;font-size:.72rem;font-weight:900;letter-spacing:.04em;color:#7c2d12;background:#fff7ed;border:1px solid #fed7aa;border-radius:999px;padding:5px 9px}.affiliate-note{display:block;font-size:.78rem;color:var(--muted)}.affiliate-action{flex:0 0 auto}.affiliate-cta{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:12px 18px;border-radius:14px;background:var(--brand);color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(37,99,235,.18);transition:.15s}.affiliate-cta:hover{filter:brightness(.96);transform:translateY(-1px)}@media(max-width:780px){.affiliate-panel{align-items:stretch;flex-direction:column}.affiliate-action{width:100%}.affiliate-cta{width:100%}}\n'''
              css_path.write_text(css, encoding='utf-8')

          home = Path('index.html')
          s = home.read_text(encoding='utf-8')
          if a8 not in s:
              block = f'<section class="section affiliate-section"><div class="container"><div class="affiliate-panel"><div class="affiliate-copy"><span class="affiliate-pr">PR・アフィリエイト広告</span><h2>Webサイトを作る人向け</h2><p>独自ドメインを取得して、覚えやすいURLでサイトを運営したい人向けのサービスです。</p><span class="affiliate-note">申込み・料金・キャンペーン内容は広告主サイトでご確認ください。</span></div><div class="affiliate-action"><a class="affiliate-cta" href="{a8}" rel="nofollow">お名前.comでドメインを探す →</a><img border="0" width="1" height="1" src="{pixel}" alt=""></div></div></div></section>'
              marker = '<section class="section seo-guide" id="seo-guide">'
              if marker in s:
                  s = s.replace(marker, block + marker, 1)
              else:
                  s = s.replace('</main>', block + '</main>', 1)
              home.write_text(s, encoding='utf-8')

          web = Path('web/index.html')
          s = web.read_text(encoding='utf-8')
          if a8 not in s:
              block = f'<section class="section affiliate-section"><div class="container"><div class="affiliate-panel"><div class="affiliate-copy"><span class="affiliate-pr">PR・アフィリエイト広告</span><h2>独自ドメインでWebサイトを始める</h2><p>Webツールを使いながら自分のサイトも作りたい場合は、独自ドメインを取得すると短く覚えやすいURLを用意できます。</p><span class="affiliate-note">申込み・料金・キャンペーン内容は広告主サイトでご確認ください。</span></div><div class="affiliate-action"><a class="affiliate-cta" href="{a8}" rel="nofollow">お名前.comでドメインを探す →</a><img border="0" width="1" height="1" src="{pixel}" alt=""></div></div></div></section>'
              marker = '<section class="section category-seo-copy">'
              s = s.replace(marker, block + marker, 1) if marker in s else s.replace('</main>', block + '</main>', 1)
              web.write_text(s, encoding='utf-8')

          privacy = Path('privacy/index.html')
          s = privacy.read_text(encoding='utf-8')
          if 'A8.netを利用したアフィリエイト広告' not in s:
              block = '<h2>広告・アフィリエイトについて</h2><p>当サイトでは、A8.netを利用したアフィリエイト広告を掲載する場合があります。広告リンクを経由して商品・サービスの申込みや購入が行われると、当サイトが報酬を受け取ることがあります。商品・サービスの価格、条件、提供内容は広告主サイトでご確認ください。</p>'
              s = s.replace('<h2>お問い合わせ</h2>', block + '<h2>お問い合わせ</h2>', 1)
              privacy.write_text(s, encoding='utf-8')

      - name: Commit mirrored site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Sync current SuguTsucool site from Cloudflare Pages'
          git push

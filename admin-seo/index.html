<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuguTsucool｜SEO分析</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/styles.css"><style>:root{--a:#2563eb;--line:#dbe4ef;--muted:#64748b}body{background:#f8fafc}.wrap{max-width:1160px;margin:auto;padding:28px 20px 70px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.top h1{margin:4px 0}.top p{color:var(--muted);margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.auth{display:grid;grid-template-columns:1fr 260px 120px;gap:10px}.auth input{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px}.btnx{border:0;background:var(--a);color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px}.filters .active{background:#0f172a;color:#fff}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.kpi span{font-size:.76rem;color:var(--muted)}.kpi b{display:block;font-size:1.65rem;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.table{width:100%;border-collapse:collapse;font-size:.83rem}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #edf2f7}.table th{font-size:.72rem;color:var(--muted)}.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}.note{color:var(--muted);font-size:.78rem}.hidden{display:none}@media(max-width:760px){.auth{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><div class="top"><div><small>PRIVATE SEO DASHBOARD</small><h1>SuguTsucool｜SEO分析</h1><p>ガイド → ツール → 実行 → アフィリエイトの導線を確認します。</p></div><div><a href="/admin-analytics/">通常分析へ</a> / <a href="/" target="_blank">公開サイト ↗</a></div></div><section class="panel"><div class="auth"><input id="api" value="https://sugutsucool-analytics.super-canon-boy.workers.dev" aria-label="分析API URL"><input id="token" type="password" placeholder="ADMIN_TOKEN" aria-label="ADMIN_TOKEN"><button class="btnx" id="load">読み込む</button></div><p class="note">トークンはsessionStorageだけに保存します。</p></section><div id="dash" class="hidden"><div class="panel filters"><button data-days="7">7日</button><button data-days="30" class="active">30日</button><button data-days="90">90日</button><span id="status" class="note"></span></div><section class="kpis"><div class="kpi"><span>ガイドPV</span><b id="guidePv">0</b></div><div class="kpi"><span>ツールPV</span><b id="toolPv">0</b></div><div class="kpi"><span>検索流入</span><b id="organic">0</b></div><div class="kpi"><span>SEO導線イベント*</span><b id="seoEvents">0</b></div></section><div class="grid"><section class="panel"><h2>上位ガイド</h2><table class="table"><thead><tr><th>ページ</th><th>PV</th><th>ユーザー</th></tr></thead><tbody id="guides"></tbody></table></section><section class="panel"><h2>上位ツール</h2><table class="table"><thead><tr><th>ページ</th><th>PV</th><th>ユーザー</th></tr></thead><tbody id="tools"></tbody></table></section></div><div class="grid"><section class="panel"><h2>流入元</h2><div id="sources"></div></section><section class="panel"><h2>SEO導線イベント</h2><div id="events"></div><p class="note">* APIが期間別event_countsを返す場合は選択期間の集計、未対応時は直近イベント内の参考値です。</p></section></div></div></main><script>(()=>{const $=s=>document.querySelector(s),api=$('#api'),token=$('#token'),dash=$('#dash'),status=$('#status');let days=30;api.value=localStorage.getItem('sugutsucool_analytics_api')||api.value;token.value=sessionStorage.getItem('sugutsucool_admin_token')||'';const n=x=>Number(x||0).toLocaleString('ja-JP'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const toolRe=/^\/(image|pdf|text|web|calculator|developer)\/[^/]+\/?$/;async function load(){if(!token.value.trim())return alert('ADMIN_TOKENを入力してください');localStorage.setItem('sugutsucool_analytics_api',api.value.trim());sessionStorage.setItem('sugutsucool_admin_token',token.value.trim());status.textContent='読み込み中…';try{const r=await fetch(api.value.trim().replace(/\/$/,'')+'/admin/summary?days='+days,{headers:{authorization:'Bearer '+token.value.trim()}});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();render(d);dash.classList.remove('hidden');status.textContent='更新 '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}catch(e){alert('読み込めませんでした。 '+e.message)}}function rows(id,a){$(id).innerHTML=a.length?a.map(r=>`<tr><td>${esc(r.path)}</td><td>${n(r.views??r.pageviews)}</td><td>${n(r.users)}</td></tr>`).join(''):'<tr><td colspan="3">データなし</td></tr>'}function render(d){const p=d.top_pages||[],g=p.filter(x=>String(x.path).startsWith('/guides/')),t=p.filter(x=>toolRe.test(String(x.path)));$('#guidePv').textContent=n(g.reduce((s,x)=>s+Number(x.views??x.pageviews??0),0));$('#toolPv').textContent=n(t.reduce((s,x)=>s+Number(x.views??x.pageviews??0),0));const src=d.sources||[],org=src.filter(x=>['google','bing','yahoo'].includes(String(x.source).toLowerCase())).reduce((s,x)=>s+Number(x.count||0),0);$('#organic').textContent=n(org);rows('#guides',g.slice(0,15));rows('#tools',t.slice(0,15));const mx=Math.max(1,...src.map(x=>+x.count||0));$('#sources').innerHTML=src.slice(0,10).map(x=>`<div style="display:grid;grid-template-columns:120px 1fr 55px;gap:9px;align-items:center;margin:10px 0"><span>${esc(x.source||'不明')}</span><div class="bar"><i style="width:${(+x.count||0)/mx*100}%"></i></div><b>${n(x.count)}</b></div>`).join('')||'データなし';const wanted=['guide_to_tool','tool_to_guide','affiliate_click','faq_open','scroll_depth','engaged_30s'],counts={};if(d.event_counts){for(const x of d.event_counts)counts[x.event_type||x.event||x.name]=Number(x.count||0)}else for(const x of d.latest||[]){const k=x.event_type||x.event;if(wanted.includes(k))counts[k]=(counts[k]||0)+1}const total=wanted.reduce((s,k)=>s+(counts[k]||0),0);$('#seoEvents').textContent=n(total);$('#events').innerHTML=wanted.map(k=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf2f7"><span>${esc(k)}</span><b>${n(counts[k])}</b></div>`).join('')}$('#load').onclick=load;document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=+b.dataset.days;document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));load()})})();</script></body></html>
